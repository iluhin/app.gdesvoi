# Публикация выпуска «ГдеСвои».
#
# Два способа:
#
# 1. Сам: новый файл releases/vX.Y.Z.md в ветке main → выпуск создаётся
#    автоматически. Заголовок — первая строка заметки (без «# »), файл —
#    apk/gdesvoi-X.Y.apk из репозитория, а если его нет — с сайта
#    (update.php?a=download), если сайт отдаёт ту же версию.
#
# 2. Вручную: Actions → «Публикация выпуска» → Run workflow (все параметры
#    задаются руками; можно пересоздать или удалить выпуск).
name: Публикация выпуска

on:
  push:
    branches: [main]
    paths: ['releases/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, например v1.1.0'
        required: true
      title:
        description: 'Заголовок выпуска'
        required: true
      version:
        description: 'Версия приложения, например 1.1 — файл берётся с сайта (пусто — без него)'
        required: false
        default: ''
      file:
        description: 'Или файл из репозитория, например apk/gdesvoi-1.0.apk'
        required: false
        default: ''
      sha256:
        description: 'Контрольная сумма ожидаемого APK (необязательно)'
        required: false
        default: ''
      recreate:
        description: 'Пересоздать выпуск, если он уже есть'
        type: boolean
        required: false
        default: false
      drop:
        description: 'Только удалить выпуск с этим тегом и ничего не создавать'
        type: boolean
        required: false
        default: false
      latest:
        description: 'Пометить как последний'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  SITE: https://gdesvoi.ru

jobs:
  auto:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Создать недостающие выпуски
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(ls releases/v*.md | sort -V); do
            TAG=$(basename "$f" .md)
            if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG уже есть"; continue; fi
            VER=${TAG#v}; VER=${VER%.0}
            TITLE="ГдеСвои $(head -n1 "$f" | sed 's/^# *//')"
            tail -n +3 "$f" > notes.md
            FILES=""
            if [ -f "apk/gdesvoi-$VER.apk" ]; then
              FILES="apk/gdesvoi-$VER.apk"
            else
              HAVE=$(curl -fsSL "$SITE/update.php?a=check&code=0" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("versionName",""))' || true)
              if [ "$HAVE" = "$VER" ]; then
                curl -fsSL -o "gdesvoi-$VER.apk" "$SITE/update.php?a=download" && head -c 2 "gdesvoi-$VER.apk" | grep -q '^PK' && FILES="gdesvoi-$VER.apk"
              fi
            fi
            LATEST=false; [ "$f" = "$(ls releases/v*.md | sort -V | tail -n1)" ] && LATEST=true
            echo "создаю $TAG: $TITLE (файл: ${FILES:-нет}, последний: $LATEST)"
            gh release create "$TAG" $FILES --title "$TITLE" --notes-file notes.md --latest=$LATEST
          done

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Удалить выпуск
        if: ${{ inputs.drop }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
            echo "выпуск $TAG удалён"
          else
            echo "выпуска $TAG нет — нечего удалять"
          fi

      - name: Взять заметку к выпуску
        if: ${{ !inputs.drop }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test -f "releases/$TAG.md" || { echo "нет файла releases/$TAG.md"; exit 1; }
          mkdir -p dist
          tail -n +3 "releases/$TAG.md" > dist/notes.md
          echo "--- заметка ---"; cat dist/notes.md

      - name: Скачать APK с сайта
        if: ${{ inputs.version != '' && !inputs.drop }}
        env:
          VERSION: ${{ inputs.version }}
          WANT_SHA: ${{ inputs.sha256 }}
        run: |
          HAVE=$(curl -fsSL "$SITE/update.php?a=check&code=0" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("versionName",""))')
          echo "на сайте сейчас: $HAVE, нужна: $VERSION"
          if [ "$HAVE" != "$VERSION" ]; then
            echo "Сайт отдаёт другую версию — сначала выложите $VERSION, потом публикуйте выпуск."
            exit 1
          fi
          curl -fsSL -o "dist/gdesvoi-$VERSION.apk" "$SITE/update.php?a=download"
          ls -l "dist/gdesvoi-$VERSION.apk"
          # APK — это zip-архив: проверяем подпись «PK» в начале файла.
          head -c 2 "dist/gdesvoi-$VERSION.apk" | grep -q '^PK' \
            || { echo "скачалось не то: это не пакет"; exit 1; }
          GOT_SHA=$(sha256sum "dist/gdesvoi-$VERSION.apk" | cut -d' ' -f1)
          echo "контрольная сумма: $GOT_SHA"
          if [ -n "$WANT_SHA" ] && [ "$GOT_SHA" != "$WANT_SHA" ]; then
            echo "Сайт отдал не тот файл — ожидалась сумма $WANT_SHA."
            exit 1
          fi

      - name: Взять файл из репозитория
        if: ${{ inputs.file != '' && !inputs.drop }}
        env:
          FILE: ${{ inputs.file }}
        run: |
          test -f "$FILE" || { echo "нет файла $FILE"; exit 1; }
          cp "$FILE" dist/
          head -c 2 "dist/$(basename "$FILE")" | grep -q '^PK' \
            || { echo "это не пакет"; exit 1; }

      - name: Создать выпуск
        if: ${{ !inputs.drop }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          VERSION: ${{ inputs.version }}
          FILE: ${{ inputs.file }}
          LATEST: ${{ inputs.latest }}
          RECREATE: ${{ inputs.recreate }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$RECREATE" != "true" ]; then
              echo "выпуск $TAG уже есть — пропускаю"
              exit 0
            fi
            # Выпуски в этом репозитории неизменяемые. Пересоздать можно
            # только то, что было опубликовано до включения неизменяемости:
            # тег, уже использованный неизменяемым выпуском, GitHub навсегда
            # запрещает занимать снова — для исправления берите новый тег.
            echo "пересоздаю $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          FILES=""
          [ -n "$VERSION" ] && FILES="dist/gdesvoi-$VERSION.apk"
          [ -n "$FILE" ] && FILES="$FILES dist/$(basename "$FILE")"
          gh release create "$TAG" $FILES \
            --title "$TITLE" \
            --notes-file dist/notes.md \
            --latest=$LATEST
